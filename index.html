<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuales Mónaco</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#1d1d1f;--muted:#5f6368;--line:#e3e3e6;--blue:#0a6cff;--bg:#fff;--soft:#f6f8fb;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding-block:40px 48px;padding-inline:16px}
  .brand{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.18em;margin:0 0 6px}
  h1{font-size:32px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
  p{margin:0 0 20px;color:var(--muted)}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  a.card{display:block;border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);background:var(--soft)}
  a.card:hover,a.card:focus-visible{border-color:var(--blue);outline:none}
  a.card b{display:block;font-size:19px;color:var(--blue)}
  a.card span{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="brand">MÓNACO · MOTO DETAILING</p>
  <h1>Manuales para asesorados</h1>
  <p>Guías paso a paso para dejar tu lavadero de motos en regla.</p>
  <ul>
    <li><a class="card" href="sayco-acinpro/"><b>Sayco y Acinpro</b><span>Licencia de música y TV, en línea, con videos</span></a></li>
    <li><a class="card" href="bomberos/"><b>Permiso de Bomberos</b><span>Concepto técnico de Bomberos, paso a paso</span></a></li>
  </ul>
</main>
</body>
</html>
